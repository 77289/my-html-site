<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你和ta</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--ink:#1d1d1f;--ink2:rgba(60,60,67,.6);--glass:rgba(255,255,255,.36);--sheet:rgba(255,255,255,.72);--fill:rgba(255,255,255,.5);--fillh:rgba(255,255,255,.74);--track:rgba(118,118,128,.14);--thumb:rgba(255,255,255,.92);--hl:rgba(255,255,255,.75);--rim:1;--sh:rgba(40,55,90,.32);--tint:#0a84ff;--bg:#e6e9f0;--b1:#ffbfa3;--b2:#86c1ff;--b3:#b4e8d4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.pro{--ink:#f5f5f7;--ink2:rgba(235,235,245,.58);--glass:rgba(38,40,48,.42);--sheet:rgba(44,44,50,.72);--fill:rgba(255,255,255,.08);--fillh:rgba(255,255,255,.15);--track:rgba(255,255,255,.09);--thumb:rgba(255,255,255,.2);--hl:rgba(255,255,255,.14);--rim:.5;--sh:rgba(0,0,0,.75);--bg:#050507;--b1:#17386e;--b2:#0c4f57;--b3:#4a2a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;background-color:var(--bg);color:var(--ink);display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:20px;transition:background-color .8s}

.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;transition:background-color .8s;will-change:transform}
.bg i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background-color:var(--b1);animation:f1 28s ease-in-out infinite}
.bg i:nth-child(2){width:58vmax;height:58vmax;right:-20vmax;top:10vmax;background-color:var(--b2);animation:f2 34s ease-in-out infinite}
.bg i:nth-child(3){width:50vmax;height:50vmax;left:10vmax;bottom:-24vmax;background-color:var(--b3);animation:f3 30s ease-in-out infinite}
@keyframes f1{50%{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes f2{50%{transform:translate(-8vmax,6vmax) scale(.92)}}
@keyframes f3{50%{transform:translate(7vmax,-8vmax) scale(1.12)}}

.glass{position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:var(--rim);background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,rgba(255,255,255,.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.wrap{position:relative;z-index:1;width:100%;max-width:540px}
main{width:100%;padding:30px 22px 24px;border-radius:44px;background-color:var(--glass);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);box-shadow:0 40px 90px -40px var(--sh),inset 0 1px 1px var(--hl),inset 0 -14px 28px -16px var(--hl)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:22px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:15px;margin-top:4px}
.chip{flex:none;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--tint);background-color:var(--fill);box-shadow:inset 0 1px 0 var(--hl);cursor:pointer;transition:transform .3s cubic-bezier(.32,.72,0,1)}
.chip:active{transform:scale(.94)}

.hb{display:flex;gap:8px;flex:none}
.sheet a{color:var(--tint);text-decoration:none;font-weight:600}
.sheet p{user-select:text;-webkit-user-select:text}
.home{position:relative;z-index:1;width:100%;max-width:860px;text-align:center;padding:24px 0 8px}
.home>*{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.home>:nth-child(2){animation-delay:.08s}.home>:nth-child(3){animation-delay:.16s}.home>:nth-child(4){animation-delay:.24s}.home>:nth-child(5){animation-delay:.32s}.home>:nth-child(6){animation-delay:.4s}
.eyebrow{font-size:17px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.home h1{font-size:clamp(46px,11vw,84px);font-weight:700;letter-spacing:-.045em;line-height:1.04;margin:10px 0 14px}
.lead{font-size:clamp(18px,3.4vw,24px);font-weight:500;line-height:1.4;color:var(--ink2);max-width:520px;margin:0 auto 32px}
.hseg{max-width:360px;margin:0 auto 38px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
.tile{display:flex;flex-direction:column;min-height:320px;padding:32px 28px 26px;border-radius:38px;background-color:var(--glass);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);box-shadow:0 30px 70px -40px var(--sh),inset 0 1px 1px var(--hl)}
.tile.dk{background-color:rgba(18,18,22,.86);color:#f5f5f7}
.tile h3{font-size:28px;font-weight:700;letter-spacing:-.02em}
.tile p{font-size:16px;line-height:1.55;color:var(--ink2);margin-top:8px}
.tile.dk p,.tile.dk .stat span{color:rgba(235,235,245,.62)}
.stat{margin-top:auto;padding:24px 0 20px;display:flex;align-items:baseline;gap:10px}
.stat b{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.04em}
.stat span{font-size:15px;color:var(--ink2)}
.tile .btn{flex:none;width:100%}
.btn.lt{color:#1d1d1f;background-color:#f5f5f7;box-shadow:none}
.foot2{margin-top:44px;font-size:13px;color:var(--ink2)}
.foot2 a{color:var(--tint);text-decoration:none;font-weight:600}
@media(max-width:640px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}
.nm{width:100%;height:46px;border:0;border-radius:999px;padding:0 20px;margin-bottom:14px;font:inherit;font-size:15px;text-align:center;color:var(--ink);background-color:var(--track);outline:none;transition:box-shadow .3s}
.nm::placeholder{color:var(--ink2)}
.nm:focus{box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.55)}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background-color:var(--track);margin-bottom:22px}
.thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background-color:var(--thumb);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .5s cubic-bezier(.32,.72,0,1),width .5s cubic-bezier(.32,.72,0,1)}
.seg button{position:relative;flex:1;border:0;background:none;padding:10px 0;font:inherit;font-size:15px;font-weight:500;color:var(--ink2);cursor:pointer;transition:color .3s}
.seg button.on{color:#1d1d1f;font-weight:600}

.meta{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background-color:var(--track);overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:2px;background-color:var(--tint);transition:width .5s cubic-bezier(.32,.72,0,1)}
.q{font-size:22px;font-weight:650;line-height:1.4;letter-spacing:-.01em;margin:6px 4px 20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;border:0;border-radius:24px;background-color:var(--fill);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04),inset 0 1px 0 var(--hl);transition:transform .3s cubic-bezier(.32,.72,0,1),background-color .25s,box-shadow .25s}
@media(hover:hover){.opt:hover{background-color:var(--fillh)}}
.opt:active{transform:scale(.975)}
.opt i{flex:none;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--ink2);display:grid;place-items:center;transition:background-color .25s,border-color .25s}
.opt.sel{background-color:var(--fillh);box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.55)}
.opt.sel i{background-color:var(--tint);border-color:var(--tint)}
.opt.sel i::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.skip{color:var(--ink2);background-color:transparent;box-shadow:none;font-size:15px}
.opt.skip.sel{box-shadow:inset 0 0 0 1.5px var(--track)}
.opt.skip.sel i{background-color:var(--ink2);border-color:var(--ink2)}

.nav{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;height:52px;border:0;border-radius:999px;font:inherit;font-size:16px;font-weight:600;color:var(--tint);background-color:var(--fill);cursor:pointer;box-shadow:inset 0 1px 0 var(--hl),0 6px 16px -8px var(--sh);transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .3s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.pri{color:#fff;background-image:linear-gradient(180deg,#42a0ff,#0a7aff);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -10px rgba(10,122,255,.8)}
.btn.pro{color:#fff;background-image:linear-gradient(180deg,#3a3a3d,#0d0d0f);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -10px rgba(0,0,0,.7)}

.res-top{display:flex;align-items:center;gap:20px;margin:4px 0 18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--track)}
.ring .v{stroke:var(--tint);stroke-dasharray:301.6;stroke-dashoffset:301.6}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tier{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.lab{font-size:13px;color:var(--ink2);margin-top:2px}
.open{font-size:17px;line-height:1.7;font-weight:500;margin-bottom:18px;min-height:2.4em}
.grp{margin-bottom:14px}
.grp h4{font-size:13px;font-weight:600;color:var(--ink2);margin:0 4px 8px;letter-spacing:.02em}
.row{padding:12px 16px;border-radius:20px;background-color:var(--fill);margin-bottom:8px;box-shadow:inset 0 1px 0 var(--hl)}
.row b{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:3px}
.row span{font-size:16px;font-weight:600}
.close{font-size:15px;line-height:1.7;color:var(--ink2);margin:6px 4px 0}
.foot{text-align:center;font-size:12px;color:var(--ink2);opacity:.7;margin-top:14px}
.letter,.dims,.todo{border-radius:24px;padding:16px 18px;margin-bottom:14px;background-color:var(--fill);box-shadow:inset 0 1px 0 var(--hl)}
.letter h4,.dims h4,.todo h4{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px;letter-spacing:.02em}
.letter p{font-size:16px;line-height:1.85;white-space:pre-wrap;min-height:9em}
.todo p{font-size:16px;line-height:1.7}
.dim{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.dim:last-child{margin-bottom:0}
.dim>div{height:6px;border-radius:3px;background-color:var(--track);overflow:hidden}
.dim b{display:block;height:100%;width:var(--w);border-radius:3px;background-color:var(--tint);transform-origin:left}
.dim em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.go .dim b{animation:grow 1.3s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--d,0s) + .25s)}
@keyframes grow{from{transform:scaleX(0)}}
.dnote{margin-top:14px;padding-top:12px;border-top:1px solid var(--track);font-size:14px;line-height:1.7;color:var(--ink2)}
.dnote p{margin-bottom:8px}
.dnote p:last-child{margin-bottom:0}
.dnote b{color:var(--ink);margin-right:8px}
.todo ol{padding-left:20px;font-size:16px;line-height:1.7}
.todo li{margin-bottom:6px}
.todo li:last-child{margin-bottom:0}
.todo summary{cursor:pointer;list-style:none;font-size:15px;font-weight:600;color:var(--tint)}
.todo summary::-webkit-details-marker{display:none}
.recap{margin-top:10px}
.recap div{padding:10px 0;border-top:1px solid var(--track);font-size:14px}
.recap b{display:block;font-weight:500;color:var(--ink2);margin-bottom:2px}
.recap span{font-weight:600}
.recap i{float:right;font-style:normal;letter-spacing:2px;color:var(--tint);font-size:10px;margin-top:4px}
.row em{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:4px}
.ch{opacity:0;filter:blur(6px);transition:opacity .5s,filter .5s}
.ch.v{opacity:1;filter:none}
.go .rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}

.md{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
.md.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:320px;padding:26px 20px 20px;border-radius:34px;text-align:center;background-color:var(--sheet);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);box-shadow:0 30px 70px -20px rgba(0,0,0,.35),inset 0 1px 1px var(--hl);transform:scale(1.1);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.md.show .sheet{transform:none}
.sheet h3{font-size:18px;font-weight:650}
.sheet p{font-size:15px;line-height:1.55;color:var(--ink2);margin:8px 0 6px}
.sheet .nav{margin-top:16px}

.veil{position:fixed;inset:0;z-index:50;background:#000;pointer-events:none;clip-path:circle(0 at 50% 50%)}
.veil-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;color:#f5f5f7}
.veil h2{font-size:clamp(84px,24vw,150px);line-height:1;font-weight:700;letter-spacing:-.045em;padding:0 .06em;background:linear-gradient(180deg,#fff 20%,#7d7d84);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.veil p{margin-top:18px;font-size:clamp(16px,4.4vw,21px);letter-spacing:.08em;color:rgba(235,235,245,.62);opacity:0}

@media(max-width:480px){main{padding:26px 16px 20px;border-radius:38px}h1{font-size:27px}.q{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div class="home" id="home">
  <p class="eyebrow">默契小测验</p>
  <h1>测测你和ta</h1>
  <p class="lead">挑一个模式，凭直觉回答几道小题。</p>
  <nav class="seg hseg" id="hseg"><span class="thumb"></span><button data-m="love" class="on">爱情</button><button data-m="friend">友情</button><button data-m="random">随便一测</button></nav>
  <div class="tiles">
    <div class="tile glass"><h3>普通测试</h3><p>轻松上手，答完就能看到契合度和一段简短的解读。</p><div class="stat"><b>6</b><span>道题 · 约 1 分钟</span></div><button class="btn pri" id="goN">开始测试</button></div>
    <div class="tile glass dk"><h3>Pro 测试</h3><p>更完整的题目，更细的关系画像，一段写给你们的话，以及可以马上去做的小事。</p><div class="stat"><b>15</b><span>道题 · 约 3 分钟</span></div><button class="btn lt" id="goP">进入 Pro</button></div>
  </div>
  <p class="foot2">作者 <a href="#contact" id="author">Fang</a></p>
</div>
<div class="wrap" id="wrap" hidden><main class="glass" id="card">
  <header>
    <div><h1>测测你和ta</h1><p class="sub" id="sub"></p></div>
    <div class="hb"><button class="chip" id="hm">主页</button><button class="chip" id="xp" hidden>退出 Pro</button></div>
  </header>
  <input class="nm" id="nm" maxlength="8" placeholder="给ta起个称呼（可选）" autocomplete="off">
  <nav class="seg" id="segEl">
    <span class="thumb" id="th"></span>
    <button data-m="love" class="on">爱情</button><button data-m="friend">友情</button><button data-m="random">随便一测</button>
  </nav>

  <div id="stage">
    <section id="quiz">
      <div class="meta"><span id="prog"></span><div class="bar"><b id="fill"></b></div></div>
      <div id="qc"><div class="q" id="qt"></div><div class="opts" id="opts"></div></div>
      <div class="nav"><button class="btn" id="prev">上一题</button><button class="btn pri" id="next" disabled>下一题</button></div>
    </section>

    <section id="result" hidden>
      <div class="res-top rise">
        <div class="ring"><svg viewBox="0 0 112 112"><circle class="t" cx="56" cy="56" r="48"/><circle class="v" id="rv" cx="56" cy="56" r="48"/></svg><span id="num">0</span></div>
        <div><div class="lab" id="rtag"></div><div class="tier" id="tier"></div><div class="lab" id="rlab">契合度</div></div>
      </div>
      <p class="open" id="open"></p>
      <div class="letter rise" id="letter" hidden></div>
      <div class="dims rise" id="dims" hidden></div>
      <div class="todo rise" id="style" hidden></div>
      <div id="rows" class="rise"></div>
      <div class="todo rise" id="all" hidden></div>
      <div class="todo rise" id="todo"></div>
      <p class="close rise" id="close"></p>
      <div class="nav rise"><button class="btn" id="again">再测一次</button><button class="btn pro" id="proBtn">Pro 测试</button></div>
      <div class="foot"><button class="chip" id="copy">复制结果</button><p style="margin-top:10px">仅供娱乐</p></div>
    </section>
  </div>
</main></div>

<div class="md" id="md"><div class="sheet glass"><h3 id="mt"></h3><p id="mm"></p><div class="nav" id="mb"></div></div></div>
<div class="veil" id="veil"><div class="veil-c"><h2 id="vh">Pro</h2><p id="vp">更多题目，更细致的解读</p></div></div>

<script>
(function(){
"use strict";

love:[

    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.frequency.setValueAtTime(720,t);o.frequency.exponentialRampToValueAtTime(320,t+.05);
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.06);
  }catch(e){}
}

  const ease="cubic-bezier(.76,0,.24,1)",pop="cubic-bezier(.16,1,.3,1)";
  veil.style.pointerEvents="auto";
  fo.animate([{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"scale(.94)",filter:"blur(10px)"}],{duration:750,easing:ease,fill:"forwards"});
  veil.animate([{clipPath:"circle(0px at "+x+"px "+y+"px)"},{clipPath:"circle("+R+"px at "+x+"px "+y+"px)"}],{duration:1000,easing:ease,fill:"forwards"});
  await wait(760);
  vh.animate([{opacity:0,transform:"scale(1.16)",filter:"blur(26px)"},{opacity:1,transform:"scale(1)",filter:"blur(0)"}],{duration:1200,easing:pop,fill:"forwards"});
  await wait(380);
  vp.animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:900,easing:pop,fill:"forwards"});
  await wait(1700);
  pro=true;chrome();begin();window.scrollTo(0,0);if(fromHome){snap=null;home.hidden=true;wrap.hidden=false;seg(false)}
  [card,home].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  card.animate([{opacity:0,transform:"scale(.94)",filter:"blur(14px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:1100,delay:150,easing:pop,fill:"backwards"});
  vh.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(1.08)"}],{duration:600,easing:"ease-in",fill:"forwards"});
  vp.animate([{opacity:1},{opacity:0}],{duration:400,fill:"forwards"});
  veil.animate([{opacity:1},{opacity:0}],{duration:900,delay:150,easing:"ease-out",fill:"forwards"});
  await wait(1100);
  [veil,vh,vp].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  veil.style.pointerEvents="";busy=false;
}
const FX=[{opacity:1,filter:'blur(0)',transform:'none'},{opacity:0,filter:'blur(10px)',transform:'scale(.985)'}];
async function view(show,hide,fn){
  busy=true;
  const t=e=>e===wrap?card:e;
  const o=t(hide).animate(FX,{duration:260,easing:'ease-in',fill:'forwards'});
  await o.finished;
  hide.hidden=true;o.cancel();
  if(fn)fn();
  show.hidden=false;seg(false);window.scrollTo(0,0);
  t(show).animate(FX.slice().reverse(),{duration:650,easing:'cubic-bezier(.16,1,.3,1)'});
  busy=false;
}
function exitPro(){
  if(busy)return;
  swap(()=>{
    pro=false;
    if(snap){mode=snap.mode;qs=snap.qs;ans=snap.ans;i=0;chrome();showResult()}
    else{chrome();begin()}
  },card);
}

/* 事件 */
segBtns.forEach(b=>b.onclick=()=>{
  if(busy||(b.dataset.m===mode&&result.hidden))return;
  tick();
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.m===b.dataset.m));seg(true);
  swap(()=>{mode=b.dataset.m;begin()});
});
prev.onclick=()=>{if(busy)return;tick();go(i-1)};
next.onclick=()=>{if(busy||ans[i]===undefined)return;tick();i===qs.length-1?finish():go(i+1)};
$("#again").onclick=()=>{if(busy)return;tick();swap(begin)};
proBtn.onclick=async()=>{
  if(busy)return;tick();
  if(await modal("Pro 测试","更多题目，更细致的解读。",[["取消",0],["进入",1,true]]))enterPro(proBtn,false);
};
xp.onclick=()=>{tick();exitPro()};
addEventListener("resize",()=>{if(!pro)seg(false)});
try{nameT=localStorage.getItem('qz_name')||'';$('#nm').value=nameT}catch(_){}
$('#nm').oninput=e=>{
  nameT=e.target.value.trim();
  try{localStorage.setItem('qz_name',nameT)}catch(_){}
  if(!quiz.hidden&&qs.length&&!busy)render();
};
$('#copy').onclick=async e=>{
  tick();const b=e.target;
  try{await navigator.clipboard.writeText(lastTxt)}catch(_){
    const a=document.createElement('textarea');a.value=lastTxt;document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(_){}a.remove();
  }
  b.textContent='已复制';setTimeout(()=>b.textContent='复制结果',1600);
};
$('#hseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(busy)return;tick();mode=b.dataset.m;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));seg(true);
});
$('#goN').onclick=()=>{if(busy)return;tick();view(wrap,home,()=>{pro=false;snap=null;chrome();begin()})};
$('#goP').onclick=e=>{if(busy)return;tick();enterPro(e.currentTarget,true)};
$('#hm').onclick=()=>{if(busy)return;tick();view(home,wrap,()=>{pro=false;chrome()})};
$('#author').onclick=e=>{
  e.preventDefault();tick();
  modal('作者 Fang','',[['好',1,true]]);
  $('#mm').innerHTML='你可以通过邮箱联系我<br><br><a href="mailto:703769461@qq.com">703769461@qq.com</a><br><a href="mailto:ruil83717@gmail.com">ruil83717@gmail.com</a>';
};
addEventListener('keydown',e=>{
  if(busy||wrap.hidden||quiz.hidden||e.target.tagName==='INPUT'||$('#md').classList.contains('show'))return;
  const k=e.key;
  if(k>='1'&&k<='5'){const b=opts.children[+k-1];if(b)b.click()}
  else if(k==='ArrowLeft')prev.click();
  else if(k==='ArrowRight'||k==='Enter')next.click();
});

chrome();begin();
requestAnimationFrame(()=>seg(false));
})();
</script>
